name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile.backend'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        run: dotnet build backend/restaurant-backend-app/restaurant-backend-app.sln -c Release
      - name: Build local host (non-AWS)
        run: dotnet build backend/restaurant-backend-app/dnapp/local-host/LocalHost.csproj -c Release
      - name: Unit tests
        run: dotnet test backend/restaurant-backend-app/Tests/APIHandler.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=results.trx"
      - name: Docker image builds
        run: docker build -f Dockerfile.backend -t restaurant-api .
