# Безкоштовний деплой фронтенду на GitHub Pages (без AWS).
# Збірка "development" лишає мок-бекенд активним: ?demo працює без сервера.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/restaurant-frontend-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/restaurant-frontend-app/.nvmrc
          cache: npm
          cache-dependency-path: frontend/restaurant-frontend-app/package-lock.json
      - run: npm ci
      - name: Unit tests (не блокують деплой демо)
        continue-on-error: true
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Build against the real API (repo variable BACKEND_URL is set)
        if: ${{ vars.BACKEND_URL != '' }}
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"
      - name: Build demo on mocks (BACKEND_URL is not set)
        if: ${{ vars.BACKEND_URL == '' }}
        run: npx ng build --configuration development --base-href "/${{ github.event.repository.name }}/"
      - name: SPA fallback for Pages
        run: cp dist/restaurant-frontend-app/browser/index.html dist/restaurant-frontend-app/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/restaurant-frontend-app/dist/restaurant-frontend-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
